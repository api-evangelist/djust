name: Djust
description: >-
  DJUST is a French all-in-one, modular B2B commerce platform that helps
  distributors, wholesalers, manufacturers and retailers launch and automate
  their B2B eCommerce and eProcurement operations. The platform covers automated
  order management (24/7 online ordering), AI-assisted quoting with automatic
  pricing and discounts, integrated online payments with deadline tracking, a
  conversational AI sales assistant, real-time sales analytics, and prebuilt
  ERP/CRM integrations. Customers include Eiffage, Auchan Retail and Lesaffre;
  DJUST reports EUR 1.5B GMV and 2M orders processed in 2025. Backed by
  Speedinvest.
